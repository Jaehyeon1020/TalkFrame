<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{font:14px -apple-system,sans-serif;line-height:1.7;color:#222;padding:12px}h1{font-size:24px}
</style></head><body><h1>톡프레임 설치</h1>
<p>카카오톡 하단 광고 자리에 원하는 사진을 표시합니다.</p>
<ul><li>전체 표시, 영역 채우기, 직접 영역 선택</li><li>실제 광고 비율에 맞춘 프레임과 선택 영역 꽉 채우기</li></ul>
<p>이 설치 프로그램은 <b>/Applications/TalkFrame.app</b>에 앱을 설치합니다.</p>
<p>설치 후 앱에서 이미지를 적용하면 로컬 HTTPS 서버와 hosts 설정을 구성합니다. 이때 관리자 승인과 사용자 인증서 신뢰 승인이 필요합니다.</p>
<p>macOS 13 이상이 필요합니다. Apple 공증을 받지 않은 개인 배포 앱입니다.</p>
</body></html>
