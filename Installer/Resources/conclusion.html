<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{font:14px -apple-system,sans-serif;line-height:1.7;color:#222;padding:12px}h1{font-size:24px}
</style></head><body><h1>앱 설치를 마쳤습니다</h1>
<ol><li>응용 프로그램 폴더에서 <b>톡프레임</b>을 엽니다.</li>
<li>이미지와 표시 방식을 고른 뒤 <b>이미지 적용</b>을 누릅니다.</li>
<li>macOS의 관리자 승인과 인증서 신뢰 승인을 완료합니다.</li>
<li>카카오톡을 다시 엽니다.</li></ol>
<p>macOS가 실행을 차단하면 시스템 설정 → 개인정보 보호 및 보안에서 앱 실행을 허용해 주세요.</p>
<p>앱을 종료해도 이미지 서버는 계속 실행됩니다. 삭제할 때는 앱의 <b>원래 설정으로 복구</b>를 먼저 사용해 주세요.</p>
</body></html>
